# Hermes Console 全新环境一键启动（含首次 Hermes 安装演示）
#
# 1) 生成管理员密钥：
#      python -c "import secrets; print(secrets.token_urlsafe(48))"
# 2) 填到下面的 HERMES_CONSOLE_SECRET（或 export HERMES_CONSOLE_SECRET=...）
# 3) docker compose up -d --build
# 4) 打开 http://localhost:8282，完成管理员初始化 → 运行体检 → 一键安装
#
# 国内网络：如需走代理，取消下面两行注释并改成宿主代理地址。
services:
  hermes-console:
    build: .
    image: hermes-console:0.8.3
    ports:
      - "8282:8420"
      - "20:20"
    environment:
      HERMES_CONSOLE_SECRET: "${HERMES_CONSOLE_SECRET:?请先设置管理员密钥，见本文件头注释}"
      # HTTP_PROXY: http://host.docker.internal:7890
      # HTTPS_PROXY: http://host.docker.internal:7890
    volumes:
      - console-data:/data
      - hermes-home:/hermes
    restart: unless-stopped

volumes:
  console-data:
  hermes-home:
