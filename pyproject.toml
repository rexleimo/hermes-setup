[project]
name = "hermes-setup"
version = "0.8.11"
description = "Hermes Console — 可视化运维中台：Hermes Agent 的安装、服务管理、模型供应商与消息渠道配置中心"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "ruamel.yaml>=0.18",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "qrcode>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
